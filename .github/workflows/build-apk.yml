name: Build Auto-Wifi APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias autowifi \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass autowifipassword \
            -keypass autowifipassword \
            -dname "CN=AutoWifiPortal, OU=MobileApp, O=AutoWifi, L=Hanoi, ST=Hanoi, C=VN"

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoWifiPortal-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
